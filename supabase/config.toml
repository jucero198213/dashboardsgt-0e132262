# O webhook do WhatsApp é chamado pela Meta, que não envia JWT do Supabase.
# Sem isso, a verificação (GET) e as mensagens (POST) tomariam 401.
[functions.whatsapp-webhook]
verify_jwt = false

# Chamada máquina-a-máquina pela automação do DW (auth por x-automacao-key).
[functions.automacao-notificar]
verify_jwt = false

# Chamada pelo frontend autenticado para enviar e-mails de chamados.
[functions.notify-ticket-email]
verify_jwt = true