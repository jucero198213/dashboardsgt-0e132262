name: Release Desktop

on:
  push:
    tags:
      - 'v*'   # dispara em: git tag v1.0.1 && git push origin v1.0.1

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # necessário para criar a GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build e publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                      ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:         ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName:        ${{ github.ref_name }}
          releaseName:    "SGT Workspace ${{ github.ref_name }}"
          releaseBody:    "Veja os arquivos abaixo para baixar o instalador."
          releaseDraft:   false
          prerelease:     false
