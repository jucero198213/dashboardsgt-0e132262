<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Status — DW SGT</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #121826;
    --text: #e8edf5;
    --muted: #7d8aa0;
    --accent: #FE8005;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
    gap: 24px;
  }
  header { text-align: center; }
  header .brand { font-size: 13px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  header .title { font-size: 22px; font-weight: 600; margin-top: 4px; }
  header .clock { font-size: 14px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .orb {
    width: 176px; height: 176px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 76px; transition: all .4s ease; position: relative;
  }
  .orb::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid currentColor; opacity: .25;
  }
  .state-online   .orb { color: var(--green);  box-shadow: 0 0 90px -10px var(--green); animation: pulse 2s ease-in-out infinite; }
  .state-degraded .orb { color: var(--yellow); box-shadow: 0 0 90px -10px var(--yellow); }
  .state-offline  .orb { color: var(--red);    box-shadow: 0 0 90px -10px var(--red); animation: shake .5s ease-in-out infinite; }
  .state-loading  .orb { color: var(--muted); }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .status-label { font-size: 32px; font-weight: 700; letter-spacing: .5px; text-align: center; }
  .status-sub { font-size: 15px; color: var(--muted); margin-top: 6px; text-align: center; }
  .state-online   .status-label { color: var(--green); }
  .state-degraded .status-label { color: var(--yellow); }
  .state-offline  .status-label { color: var(--red); }

  .metrics { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .metric {
    background: var(--card); border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px; padding: 14px 20px; min-width: 128px; text-align: center;
  }
  .metric .val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .metric .val.warn { color: var(--yellow); }
  .metric .val.bad { color: var(--red); }

  .history-wrap { text-align: center; }
  .history-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .history { display: flex; gap: 3px; align-items: flex-end; height: 36px; justify-content: center; }
  .bar { width: 8px; height: 100%; border-radius: 2px; background: #2a3242; }
  .bar.ok { background: var(--green); }
  .bar.deg { background: var(--yellow); }
  .bar.down { background: var(--red); }

  footer { font-size: 12px; color: var(--muted); }
</style>
</head>
<body class="state-loading">
  <header>
    <div class="brand">SGT · Data Warehouse</div>
    <div class="title">Status do Servidor</div>
    <div class="clock" id="clock">—</div>
  </header>

  <div class="orb-wrap">
    <div class="orb" id="orb">•••</div>
    <div>
      <div class="status-label" id="label">Verificando…</div>
      <div class="status-sub" id="sub">Conectando ao servidor</div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="val" id="ping">—</div><div class="lbl">Resposta</div></div>
    <div class="metric"><div class="val" id="avg">—</div><div class="lbl">Resp. média</div></div>
    <div class="metric"><div class="val" id="uptime">—</div><div class="lbl">Disponibilidade</div></div>
    <div class="metric"><div class="val" id="since">—</div><div class="lbl" id="sinceLbl">No ar há</div></div>
    <div class="metric"><div class="val" id="outages">0</div><div class="lbl">Quedas</div></div>
    <div class="metric"><div class="val" id="last">—</div><div class="lbl">Última checagem</div></div>
  </div>

  <div class="history-wrap">
    <div class="history-lbl">Últimas checagens</div>
    <div class="history" id="history"></div>
  </div>

  <footer>Atualiza a cada 15s · <span id="url"></span></footer>

<script>
  const HEALTH_URL = "https://dw.dwsgtlog.com/health";
  const INTERVAL_MS = 15000;
  const TIMEOUT_MS = 10000;
  const MAX_BARS = 40;

  const $ = (id) => document.getElementById(id);
  $("url").textContent = HEALTH_URL;

  let history = [];          // "ok" | "deg" | "down"
  let checks = 0, ups = 0;
  let sumMs = 0, msCount = 0;
  let outages = 0;
  let lastCheckTs = null;
  let currentUp = null;      // true/false
  let stateSince = Date.now(); // quando entrou no estado atual (up/down)

  function setState(cls, emoji, label, sub) {
    document.body.className = "state-" + cls;
    $("orb").textContent = emoji;
    $("label").textContent = label;
    $("sub").textContent = sub;
  }

  function fmtDur(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "min";
    const h = Math.floor(m / 60);
    const rm = m % 60;
    if (h < 24) return h + "h" + (rm ? " " + rm + "min" : "");
    const d = Math.floor(h / 24);
    return d + "d " + (h % 24) + "h";
  }

  function renderHistory() {
    const el = $("history");
    el.innerHTML = "";
    for (let i = 0; i < MAX_BARS; i++) {
      const b = document.createElement("div");
      const idx = history.length - MAX_BARS + i;
      b.className = "bar" + (idx >= 0 ? " " + history[idx] : "");
      el.appendChild(b);
    }
  }

  async function check() {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    const t0 = performance.now();
    let up = false;
    try {
      const r = await fetch(HEALTH_URL, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(t);
      const ms = Math.round(performance.now() - t0);
      const data = await r.json();
      checks++;
      if (r.ok && data.db) {
        up = true; ups++;
        sumMs += ms; msCount++;
        history.push("ok");
        setState("online", "✓", "ONLINE", "Servidor e banco respondendo normalmente");
        $("ping").textContent = ms + " ms";
      } else {
        history.push("deg");
        setState("degraded", "!", "INSTÁVEL", "Servidor de pé, mas o banco não respondeu");
        $("ping").textContent = ms + " ms";
      }
    } catch (e) {
      clearTimeout(t);
      checks++;
      history.push("down");
      setState("offline", "✕", "OFFLINE", "Servidor não respondeu — verifique o túnel/servidor");
      $("ping").textContent = "—";
    }

    // Transição de estado (conta quedas + reinicia o cronômetro "no ar há")
    if (currentUp === null) { currentUp = up; stateSince = Date.now(); }
    else if (up !== currentUp) {
      if (currentUp === true && up === false) outages++;
      currentUp = up;
      stateSince = Date.now();
    }

    lastCheckTs = Date.now();
    if (history.length > MAX_BARS) history = history.slice(-MAX_BARS);
    $("uptime").textContent = checks ? Math.round((ups / checks) * 100) + "%" : "—";
    $("avg").textContent = msCount ? Math.round(sumMs / msCount) + " ms" : "—";
    $("outages").textContent = outages;
    $("outages").className = "val" + (outages > 0 ? " bad" : "");
    renderHistory();
  }

  function tick() {
    const now = new Date();
    $("clock").textContent = now.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" })
      + " · " + now.toLocaleTimeString("pt-BR");

    if (lastCheckTs) {
      const s = Math.round((Date.now() - lastCheckTs) / 1000);
      $("last").textContent = s <= 1 ? "agora" : "há " + s + "s";
    }
    if (currentUp !== null) {
      $("since").textContent = fmtDur(Date.now() - stateSince);
      const bad = currentUp === false;
      $("sinceLbl").textContent = bad ? "Fora do ar há" : "No ar há";
      $("since").className = "val" + (bad ? " bad" : "");
    }
  }

  renderHistory();
  check();
  setInterval(check, INTERVAL_MS);
  setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
